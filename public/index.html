<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB CRUD Form</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h1>Simple MongoDB CRUD Form</h1>

  <!-- CRUD Form -->
  <form id="crud-form">
    <input type="hidden" id="user-id"> <!-- Hidden field for updates -->

    <label for="name">Name: </label>
    <input type="text" id="name" required><br><br>

    <label for="age">Age: </label>
    <input type="number" id="age" required><br><br>

    <button type="submit">Submit</button>
    <button type="button" id="cancel-update" style="display: none;">Cancel</button>
  </form>

  <!-- Display stored data -->
  <h2>Stored Data</h2>
  <ul id="data-list"></ul>

  <script>
    // Handle form submission for Create or Update
    document.getElementById('crud-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const id = document.getElementById('user-id').value;
      const name = document.getElementById('name').value;
      const age = document.getElementById('age').value;

      if (!name || !age) {
        alert('Please fill in all fields.');
        return;
      }

      const data = { name, age };

      if (id) {
        // Update
        $.ajax({
          url: `/api/update/${id}`,
          type: 'PUT',
          contentType: 'application/json',
          data: JSON.stringify(data),
          success: function () {
            alert('Data updated successfully!');
            resetForm();
            getData();
          },
          error: function (xhr) {
            alert('Update error: ' + xhr.responseJSON.message);
          }
        });
      } else {
        // Create
        $.post('/api/submit', data, function () {
          alert('Data added successfully!');
          resetForm();
          getData();
        }).fail(function (xhr) {
          alert('Insert error: ' + xhr.responseJSON.message);
        });
      }
    });

    // Fetch and display data
    function getData() {
      $.get('/api/data', function (data) {
        const list = document.getElementById('data-list');
        list.innerHTML = '';

        data.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.name}, Age: ${item.age} `;

          // Update button
          const updateBtn = document.createElement('button');
          updateBtn.textContent = 'Update';
          updateBtn.onclick = function () {
            document.getElementById('user-id').value = item._id;
            document.getElementById('name').value = item.name;
            document.getElementById('age').value = item.age;
            document.getElementById('cancel-update').style.display = 'inline';
          };

          // Delete button
          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.onclick = function () {
            if (confirm('Are you sure you want to delete this entry?')) {
              $.ajax({
                url: `/api/delete/${item._id}`,
                type: 'DELETE',
                success: function () {
                  alert('Deleted successfully!');
                  getData();
                },
                error: function (xhr) {
                  alert('Delete error: ' + xhr.responseJSON.message);
                }
              });
            }
          };

          li.appendChild(updateBtn);
          li.appendChild(deleteBtn);
          list.appendChild(li);
        });
      });
    }

    // Reset form
    function resetForm() {
      document.getElementById('crud-form').reset();
      document.getElementById('user-id').value = '';
      document.getElementById('cancel-update').style.display = 'none';
    }

    document.getElementById('cancel-update').addEventListener('click', resetForm);

    // Initial data load
    document.addEventListener('DOMContentLoaded', getData);
  </script>
</body>
</html>
