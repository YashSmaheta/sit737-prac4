<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Microservice</title>
</head>
<body>
    <h1>Calculator Microservice</h1>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    
    <button onclick="calculate('add')">Add</button>
    <button onclick="calculate('subtract')">Subtract</button>
    <button onclick="calculate('multiply')">Multiply</button>
    <button onclick="calculate('divide')">Divide</button>
    <button onclick="calculate('power')">power</button>
    <button onclick="calculate('sqrt')">sqrt</button>
    <button onclick="calculate('modulo')">modulo</button>

    <p>Result: <span id="result"></span></p>

    <script>
        function calculate(operation) {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;

            fetch(`/${operation}?num1=${num1}&num2=${num2}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerText = data.result ?? data.error;
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
